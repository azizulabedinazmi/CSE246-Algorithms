<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <style>
      .b{transform-box:fill-box;transform-origin:bottom}
      .a1{animation:a1 6s ease-in-out infinite}.a2{animation:a2 6s ease-in-out infinite}
      @keyframes a1{0%,30%{transform:translateX(0)}50%,80%{transform:translateX(240px)}100%{transform:translateX(0)}}
      @keyframes a2{0%,30%{transform:translateX(0)}50%,80%{transform:translateX(-240px)}100%{transform:translateX(0)}}
    </style>
  </defs>
  <rect width="1200" height="320" fill="#fafafa"/>
  <!-- Swiss grid -->
  <rect x="0" y="0" width="560" height="320" fill="#0a0a0a"/>
  <text x="48" y="78" font-family="Consolas, Menlo, monospace" font-size="16" fill="#ef4444" letter-spacing="4">CSE246</text>
  <text x="44" y="168" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="88" font-weight="900" fill="#fafafa" letter-spacing="-3">Algo-</text>
  <text x="44" y="248" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="88" font-weight="900" fill="#fafafa" letter-spacing="-3">rithms</text>
  <text x="48" y="290" font-family="Consolas, Menlo, monospace" font-size="14" fill="#a3a3a3">sorting · searching · greedy · DP · graphs — C / C++</text>
  <!-- bars being sorted -->
  <g transform="translate(620 260)" fill="#0a0a0a">
    <rect x="0" y="-70" width="44" height="70"/>
    <rect x="60" y="-110" width="44" height="110"/>
    <rect class="a1" x="120" y="-200" width="44" height="200" fill="#ef4444"/>
    <rect x="180" y="-140" width="44" height="140"/>
    <rect x="240" y="-90" width="44" height="90"/>
    <rect x="300" y="-170" width="44" height="170"/>
    <rect class="a2" x="360" y="-50" width="44" height="50" fill="#ef4444"/>
    <rect x="420" y="-185" width="44" height="185"/>
    <line x1="-10" y1="0" x2="480" y2="0" stroke="#0a0a0a" stroke-width="3"/>
    <text x="0" y="30" font-family="Consolas, Menlo, monospace" font-size="14" fill="#525252">swap(a[2], a[6])  ·  O(n log n)</text>
  </g>
</svg>
